[voltage,capacitance,capRating,capPolarity].forEach(x=>x.oninput=()=>updateCircuitLabels());variableResistance.oninput=()=>{resistance.value=variableResistance.value;updateCircuitLabels()};$('fixedResistorMode').onclick=()=>{resistorMode='fixed';renderResistorChoices();updateCircuitLabels()};$('variableResistorMode').onclick=()=>{resistorMode='variable';variableResistance.value=resistance.value;renderResistorChoices();updateCircuitLabels()};$('switchBtn').onclick=()=>{if(!batteryFailed){switchOn=!switchOn;$('switchBtn').classList.toggle('on',switchOn);updateCircuitLabels()}};$('pauseBtn').onclick=()=>{animating=!animating;$('pauseBtn').textContent=animating?t('pauseElectrons'):t('resumeElectrons')};$('resetBtn').onclick=()=>{voltage.value=9;resistance.value=330;capacitance.value=2200;capRating.value=16;capPolarity.value='correct';ledKey='red';resistorMode='fixed';variableResistance.value=330;switchOn=true;animating=true;capV=0;electronDrift=0;chargeAnimPhase=0;flowElectrons.forEach((e,i)=>e.u=i/flowElectrons.length);ledFailed=capFailed=batteryFailed=false;ledStress=batteryStress=capStress=0;$('switchBtn').classList.add('on');renderLedChoices();renderResistorChoices();updateCircuitLabels();$('pauseBtn').textContent=t('pauseElectrons')};
let tradeValues={fast:100,cheap:50,good:0};
const TRADE_MAX=200;
function tradeMessage(){
 const active=['fast','cheap','good'].filter(k=>tradeValues[k]>0);
 const vals=active.map(k=>`${t(k)} ${Math.round(tradeValues[k])}%`).join(' • '),total=Math.round(Object.values(tradeValues).reduce((a,b)=>a+b,0));
 if(lang==='ar')return `${vals||'0%'} — المجموع ${total}% من حد أقصى 200%. اسحب أي شريط وسيعمل تلقائياً، وإذا تجاوز المجموع 200% تنخفض الخيارات الأخرى.`;
 return `${vals||'0%'} — total ${total}% of a 200% maximum. Drag any bar to turn it on; if the total would exceed 200%, the other bars make room automatically.`;
}
function updateTrade(){
 for(const k of ['fast','cheap','good']){const cap=k[0].toUpperCase()+k.slice(1),v=Math.round(tradeValues[k]),r=$('m'+cap);r.value=v;r.disabled=false;$('m'+cap+'Text').textContent=v+'%';document.querySelector(`.tradeToggle[data-choice="${k}"]`)?.classList.toggle('on',v>0)}
 $('tradeResult').innerHTML=`<b>${t('result')}</b> ${tradeMessage()}`;
}
function makeRoom(changed,newValue){
 newValue=Math.max(0,Math.min(100,newValue));const keys=['fast','cheap','good'],others=keys.filter(k=>k!==changed);tradeValues[changed]=newValue;
 let over=Object.values(tradeValues).reduce((a,b)=>a+b,0)-TRADE_MAX;if(over<=0)return;
 // Reduce the other priorities proportionally so the dragged bar obeys the user's hand.
 let available=others.reduce((s,k)=>s+tradeValues[k],0);if(available<=0)return;
 for(const k of others){const cut=over*(tradeValues[k]/available);tradeValues[k]=Math.max(0,tradeValues[k]-cut)}
 // Clean up floating point leftovers.
 over=Object.values(tradeValues).reduce((a,b)=>a+b,0)-TRADE_MAX;if(over>.001){const k=others.sort((a,b)=>tradeValues[b]-tradeValues[a])[0];tradeValues[k]=Math.max(0,tradeValues[k]-over)}
}
function toggleTrade(k){
 if(tradeValues[k]>0){tradeValues[k]=0}
 else{const used=Object.values(tradeValues).reduce((a,b)=>a+b,0),start=Math.min(50,Math.max(1,TRADE_MAX-used));makeRoom(k,start)}
 updateTrade();
}
document.querySelectorAll('.tradeToggle').forEach(b=>b.onclick=()=>toggleTrade(b.dataset.choice));
for(const k of ['fast','cheap','good']){const cap=k[0].toUpperCase()+k.slice(1);$('m'+cap).oninput=e=>{makeRoom(k,+e.target.value);updateTrade()}}

const sections=[...document.querySelectorAll('main section[id]')],navs=[...document.querySelectorAll('.nav a')];const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){navs.forEach(n=>n.classList.remove('active'));document.querySelector(`.nav a[href="#${e.target.id}"]`)?.classList.add('active')}}),{rootMargin:'-35% 0px -55% 0px'});sections.forEach(s=>observer.observe(s));$('year').textContent=new Date().getFullYear();applyLanguage();renderResistorChoices();updateTrade();requestAnimationFrame(tick);
</script>
